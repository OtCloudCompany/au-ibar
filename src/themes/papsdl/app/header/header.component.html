<header class="paps-header">
  <div class="container-fluid paps-header-inner">

    <a class="paps-brand" routerLink="/home">
      <img
        src="assets/papsdl/images/au-ibar-logo-trimmed.png"
        [attr.alt]="'menu.header.image.logo' | translate"
      />
      <div class="paps-brand-text">
        
        <span class="paps-brand-secondary">
          <span>KNOWLEDGE</span>
          <span>REPOSITORY</span>
        </span>
      </div>
    </a>

    <div class="paps-search-wrapper">
<!--      <ds-search-navbar></ds-search-navbar> -->
<ds-search-form
        [inPlaceSearch]="false"
        [showScopeSelector]="false"
        [large]="false"
        brandColor="primary"
        searchPlaceholder="Search the repository ...">
      </ds-search-form>
      <a routerLink="/search" class="paps-advanced-search">
        ADVANCED SEARCH
      </a>
    </div>

    <nav
      role="navigation"
      [attr.aria-label]="'nav.user.description' | translate"
      class="paps-header-actions"
    >
      <ds-lang-switch></ds-lang-switch>
      <ds-context-help-toggle></ds-context-help-toggle>
      <ds-auth-nav-menu></ds-auth-nav-menu>
      <ds-impersonate-navbar></ds-impersonate-navbar>

      <button
        *ngIf="isMobile$ | async"
        class="paps-menu-button"
        type="button"
        (click)="toggleNavbar()"
        aria-controls="collapsingNav"
        aria-expanded="false"
        [attr.aria-label]="'nav.toggle' | translate"
      >
        <span class="fas fa-bars fa-fw" aria-hidden="true"></span>
      </button>
    </nav>

  </div>
</header>
